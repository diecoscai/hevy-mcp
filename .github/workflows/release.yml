name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: hevy-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # OIDC trusted publishing requires npm >= 11.5.1; Node 20 still
        # bundles npm 10.x, which publishes without the OIDC exchange and
        # gets a 404 from the registry.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm (OIDC trusted publishing + provenance)
        # Auth is via OIDC trusted publishing configured in the npm package
        # settings — no NPM_TOKEN env var needed.
        # Setup docs: https://docs.npmjs.com/trusted-publishers
        run: npm publish --provenance
